[project]
name = "evercookie-defense-v2"
version = "2.0.0"
description = "Evercookie Defense System V2 - 风控决策引擎重写版"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "**/migrations/**",
    "**/__pycache__/**",
    "dashboard-ui",
    "client-sdk",
    "adapters",
]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "PIE", "PL", "RUF",
]
ignore = [
    "E501",
    "PLR0913",
    "PLR2004",
    "N818",
    "RUF001",
    "RUF002",
    "RUF003",
    "BLE001",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "PLR0911", "PLC0415", "RUF001", "RUF002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["clickhouse_driver.*", "asyncmy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "slow: 耗时测试",
]

[tool.coverage.run]
branch = true
source = ["shared/src", "gateway-api/src", "admin-api/src", "worker/src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.bandit]
skips = ["B101", "B104"]
exclude_dirs = ["tests", "migrations"]
