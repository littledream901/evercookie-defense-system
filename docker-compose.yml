version: "3.9"

# =========================================================
# 本地开发环境编排（V2）
# 生产环境请配合 docker-compose.prod.yml 使用
# =========================================================

x-common-env: &common-env
  ENV: ${ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  REDIS_URL: redis://redis:6379/0
  MYSQL_URL: mysql+asyncmy://fangyu:fangyu_pass@mysql:3306/fangyu_v2
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""
  # ClickHouse 库名固定 fangyu：analytics_query.py / reputation_sync_service.py
  # 里的表前缀是硬编码的，改库名会导致查不到表。
  CLICKHOUSE_DATABASE: fangyu

services:
  redis:
    image: redis:7-alpine
    container_name: fangyu-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [fangyu-net]

  mysql:
    image: mysql:8
    container_name: fangyu-mysql
    restart: unless-stopped
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fangyu_v2
      MYSQL_USER: fangyu
      MYSQL_PASSWORD: fangyu_pass
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fangyu-net]

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: fangyu-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: fangyu
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [fangyu-net]

  gateway-api:
    build:
      context: .
      dockerfile: infrastructure/docker/gateway-api.Dockerfile
    container_name: fangyu-gateway
    restart: unless-stopped
    ports: ["8000:8080"]
    environment:
      <<: *common-env
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8080"
      # 必须带 GATEWAY_ 前缀：GatewaySettings 的 env_prefix 是 GATEWAY_，
      # 无前缀的 OTLP_ENDPOINT 读不到，trace 导出器不会启用。
      GATEWAY_OTLP_ENDPOINT: http://jaeger:4317
      GATEWAY_TRACE_SAMPLE_RATE: "1.0"
    depends_on:
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    networks: [fangyu-net]

  admin-api:
    build:
      context: .
      dockerfile: infrastructure/docker/admin-api.Dockerfile
    container_name: fangyu-admin
    restart: unless-stopped
    ports: ["8001:8081"]
    environment:
      <<: *common-env
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "8081"
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-to-a-long-random-secret-please}
    depends_on:
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    networks: [fangyu-net]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: fangyu-worker
    restart: unless-stopped
    ports: ["9100:9091"]
    environment:
      <<: *common-env
      # WorkerSettings 使用 WORKER_ 前缀，须显式覆盖，
      # 否则 pydantic-settings 无法从无前缀的 common-env 中读取，
      # 会回退到默认值 localhost，导致 Redis/ClickHouse 连不通。
      WORKER_REDIS_URL: redis://redis:6379/0
      WORKER_CLICKHOUSE_URL: http://clickhouse:8123
      WORKER_CLICKHOUSE_DATABASE: fangyu
      WORKER_BATCH_TARGET_TABLE: fangyu.decision_events
      # Stream name 必须与 gateway-api 的 event_stream_name 一致
      # （GatewaySettings.event_stream_name 默认 fangyu:events:decision）。
      WORKER_STREAM_NAME: fangyu:events:decision
      WORKER_CONSUMER_GROUP: fangyu-worker
      WORKER_CONSUMER_NAME: worker-1
      WORKER_HEALTH_PORT: "9091"
      # 必须带 WORKER_ 前缀，同 gateway 的理由
      WORKER_OTLP_ENDPOINT: http://jaeger:4317
      WORKER_TRACE_SAMPLE_RATE: "1.0"
    depends_on:
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    networks: [fangyu-net]

  dashboard-ui:
    build:
      context: .
      dockerfile: infrastructure/docker/dashboard-ui.Dockerfile
    container_name: fangyu-ui
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [admin-api]
    networks: [fangyu-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: fangyu-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
    networks: [fangyu-net]

  grafana:
    image: grafana/grafana:latest
    container_name: fangyu-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
    networks: [fangyu-net]

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: fangyu-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [fangyu-net]

volumes:
  redis-data:
  mysql-data:
  clickhouse-data:
  grafana-data:

networks:
  fangyu-net:
    driver: bridge
