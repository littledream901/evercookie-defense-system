[alembic]
script_location = alembic
prepend_sys_path = ./src
version_path_separator = os

# 实际连接串由 alembic/env.py 从 ADMIN_DATABASE_URL 或 ALEMBIC_DATABASE_URL
# 环境变量读取，此处留空占位。不要在此写入真实凭据。
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
