[project]
name = "fangyu-admin-api"
version = "2.0.0"
description = "Evercookie Defense System - Admin API"
requires-python = ">=3.11"
dependencies = [
    "fangyu-shared",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "gunicorn>=21.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    # MySQL 8 默认认证插件是 caching_sha2_password，aiomysql 依赖的 pymysql
    # 需要 cryptography 才能做 RSA 加密传输口令。缺失时连接阶段直接抛
    # RuntimeError，与驱动是否装好无关。
    "cryptography>=42.0",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "orjson>=3.9",
    "python-multipart>=0.0.9",
    "maxminddb>=2.5",
    # cidr_intel_fetcher.py 与 external_intel_fetcher.py 在运行时 import httpx。
    # 此前只列在 dev extras 里，靠 fangyu-shared 的主依赖间接可用 ——
    # shared 一旦调整 httpx 位置，本服务会启动失败。显式声明。
    "httpx>=0.27",
    "apscheduler>=3.10",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24,<2",
    "opentelemetry-instrumentation-fastapi>=0.45b0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.3",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
