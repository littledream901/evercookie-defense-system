global:
  scrape_interval:     15s
  scrape_timeout:      10s
  evaluation_interval: 30s
  external_labels:
    cluster: fangyu-prod
    region:  cn-north

rule_files:
  - /etc/prometheus/rules/recording.rules.yml
  - /etc/prometheus/rules/fangyu.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager.monitoring.svc.cluster.local:9093
      timeout: 10s
      api_version: v2

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: fangyu-gateway-api
    metrics_path: /metrics
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["fangyu"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: gateway-api
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8080"
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - target_label: service
        replacement: gateway-api

  - job_name: fangyu-admin-api
    metrics_path: /metrics
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["fangyu"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: admin-api
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8081"
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: service
        replacement: admin-api

  - job_name: fangyu-worker
    metrics_path: /metrics
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["fangyu"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: worker
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "9100"
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: service
        replacement: worker

  - job_name: kubernetes-nodes-cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex:  (.+)
        target_label:  __metrics_path__
        replacement:  /api/v1/nodes/${1}/proxy/metrics/cadvisor

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter.data.svc.cluster.local:9121"]

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse-headless.data.svc.cluster.local:9363"]

  - job_name: mysqld-exporter
    static_configs:
      - targets: ["mysqld-exporter.data.svc.cluster.local:9104"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://dashboard.fangyu.example.com/healthz
          - https://gateway.fangyu.example.com/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label:  __param_target
      - source_labels: [__param_target]
        target_label:  instance
      - target_label:  __address__
        replacement:   blackbox-exporter.monitoring.svc.cluster.local:9115
