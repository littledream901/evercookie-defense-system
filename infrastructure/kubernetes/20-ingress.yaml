apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-ui
  namespace: fangyu
  labels:
    app.kubernetes.io/name: dashboard-ui
    app.kubernetes.io/part-of: fangyu
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - dashboard.fangyu.example.com
      secretName: dashboard-fangyu-tls
  rules:
    - host: dashboard.fangyu.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-ui
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-api
  namespace: fangyu
  labels:
    app.kubernetes.io/name: gateway-api
    app.kubernetes.io/part-of: fangyu
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "128k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3"
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - gateway.fangyu.example.com
      secretName: gateway-fangyu-tls
  rules:
    - host: gateway.fangyu.example.com
      http:
        paths:
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: gateway-api
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: gateway-api
                port:
                  number: 8080
