apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fangyu

commonLabels:
  app.kubernetes.io/part-of: fangyu
  app.kubernetes.io/managed-by: kustomize

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - 10-gateway-api.yaml
  - 11-admin-api.yaml
  - 12-worker.yaml
  - 13-dashboard-ui.yaml
  - 20-ingress.yaml
  - 21-network-policy.yaml

images:
  - name: registry.example.com/fangyu/gateway-api
    newTag: latest
  - name: registry.example.com/fangyu/admin-api
    newTag: latest
  - name: registry.example.com/fangyu/worker
    newTag: latest
  - name: registry.example.com/fangyu/dashboard-ui
    newTag: latest
