apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: fangyu
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: fangyu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fangyu
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: fangyu
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: consumer
        app.kubernetes.io/part-of: fangyu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: worker
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.example.com/fangyu/worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 9100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fangyu-common-config
            - configMapRef:
                name: worker-config
            - secretRef:
                name: fangyu-common-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics
  namespace: fangyu
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: fangyu
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: metrics
      port: 9100
      targetPort: health
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: fangyu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: fangyu
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
