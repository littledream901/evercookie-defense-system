apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-api
  namespace: fangyu
  labels:
    app.kubernetes.io/name: admin-api
    app.kubernetes.io/part-of: fangyu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: fangyu
  labels:
    app.kubernetes.io/name: admin-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fangyu
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: fangyu
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: admin-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-api
          image: registry.example.com/fangyu/admin-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fangyu-common-config
            - configMapRef:
                name: admin-api-config
            - secretRef:
                name: fangyu-common-secret
            - secretRef:
                name: admin-api-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: fangyu
  labels:
    app.kubernetes.io/name: admin-api
    app.kubernetes.io/part-of: fangyu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-api
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-api
  namespace: fangyu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admin-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin-api
  namespace: fangyu
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-api
