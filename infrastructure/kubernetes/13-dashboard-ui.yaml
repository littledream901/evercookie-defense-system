apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-ui
  namespace: fangyu
  labels:
    app.kubernetes.io/name: dashboard-ui
    app.kubernetes.io/part-of: fangyu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-ui
  namespace: fangyu
  labels:
    app.kubernetes.io/name: dashboard-ui
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: fangyu
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard-ui
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: fangyu
    spec:
      serviceAccountName: dashboard-ui
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard-ui
          image: registry.example.com/fangyu/dashboard-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-conf
          configMap:
            name: dashboard-ui-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-ui
  namespace: fangyu
  labels:
    app.kubernetes.io/name: dashboard-ui
    app.kubernetes.io/part-of: fangyu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dashboard-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dashboard-ui
  namespace: fangyu
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard-ui
