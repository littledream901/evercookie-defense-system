
upstream fangyu_gateway_upstream {
    least_conn;
    server gateway-api-0:8080 max_fails=3 fail_timeout=15s;
    server gateway-api-1:8080 max_fails=3 fail_timeout=15s;
    server gateway-api-2:8080 max_fails=3 fail_timeout=15s;
    keepalive 128;
}

limit_req_zone $binary_remote_addr zone=fangyu_edge_req:20m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=fangyu_edge_conn:10m;

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ""      $scheme;
    ~*.+    $http_x_forwarded_proto;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  edge.fangyu.local;

    server_tokens off;
    client_max_body_size 128k;

    add_header X-Frame-Options        "DENY"                       always;
    add_header X-Content-Type-Options "nosniff"                    always;
    add_header Referrer-Policy        "no-referrer"                always;

    limit_req  zone=fangyu_edge_req burst=400 nodelay;
    limit_conn fangyu_edge_conn 100;

    location = /healthz {
        access_log off;
        proxy_pass http://fangyu_gateway_upstream/healthz;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://fangyu_gateway_upstream/readyz;
    }

    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://fangyu_gateway_upstream/metrics;
    }

    location /v2/decide {
        proxy_pass         http://fangyu_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 2s;
        proxy_send_timeout    3s;
        proxy_read_timeout    5s;
        proxy_next_upstream   error timeout http_502 http_503;
    }

    location /v2/ {
        proxy_pass         http://fangyu_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;
    }

    location / {
        return 404 "not found\n";
    }
}
