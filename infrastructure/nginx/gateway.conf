
# 单实例部署：服务名与 docker-compose 中的 gateway-api 对齐。
# 横向扩容时（docker compose up -d --scale gateway-api=3）Docker 内嵌 DNS
# 会把 gateway-api 解析成多个 A 记录，无需在此逐个列出副本。
upstream fangyu_gateway_upstream {
    least_conn;
    server gateway-api:8080 max_fails=3 fail_timeout=15s;
    keepalive 128;
}

limit_req_zone $binary_remote_addr zone=fangyu_edge_req:20m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=fangyu_edge_conn:10m;

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ""      $scheme;
    ~*.+    $http_x_forwarded_proto;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  edge.fangyu.local;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from 169.254.0.0/16;
    set_real_ip_from ::1;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    server_tokens off;
    client_max_body_size 128k;

    add_header X-Frame-Options        "DENY"                       always;
    add_header X-Content-Type-Options "nosniff"                    always;
    add_header Referrer-Policy        "no-referrer"                always;

    limit_req  zone=fangyu_edge_req burst=400 nodelay;
    limit_conn fangyu_edge_conn 100;

    # gateway-api 的路由挂在 /v2 前缀下（v2_router = APIRouter(prefix="/v2")）
    location = /healthz {
        access_log off;
        proxy_pass http://fangyu_gateway_upstream/v2/healthz;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://fangyu_gateway_upstream/v2/readyz;
    }

    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://fangyu_gateway_upstream/v2/metrics;
    }

    location /v2/decide {
        proxy_pass         http://fangyu_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 2s;
        proxy_send_timeout    3s;
        proxy_read_timeout    5s;
        proxy_next_upstream   error timeout http_502 http_503;
    }

    location /v2/ {
        proxy_pass         http://fangyu_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;
    }

    location / {
        return 404 "not found\n";
    }
}
