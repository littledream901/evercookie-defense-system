
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    charset      utf-8;
    server_tokens off;

    client_max_body_size 8m;
    client_body_buffer_size 128k;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    add_header X-Frame-Options              "SAMEORIGIN"       always;
    add_header X-Content-Type-Options       "nosniff"          always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection             "1; mode=block"    always;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS。nginx 默认只在启动时解析 proxy_pass 里的主机名并永久
    # 缓存结果，上游容器一旦重建就会拿到新 IP，而 nginx 仍指向旧地址 → 502。
    # 配 resolver 并把上游写成变量，可让解析推迟到请求时并按 valid 周期刷新。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* ^/.+\.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # 前端统一走 /api/v2/*，剥离 /api 前缀后转发给 admin-api（其路由为 /v2/*）。
    # nginx 前缀匹配取最长者，故 /api/gateway/ 仍会优先命中它自己的 location。
    location /api/ {
        # 主机名写成变量才会走 resolver 做运行时解析。代价是 nginx 不再自动
        # 剥离 location 前缀（那是 proxy_pass 末尾斜杠的行为），故用 rewrite
        # 显式还原：/api/v2/auth/me → /v2/auth/me。
        set $admin_upstream admin-api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://$admin_upstream:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
        proxy_buffering       on;
        proxy_next_upstream   error timeout http_502 http_503 http_504;
    }

    location /api/gateway/ {
        # 同 /api/ 的处理：变量上游 + 显式 rewrite。
        # /api/gateway/v2/decide → /v2/decide
        set $gateway_upstream gateway-api;
        rewrite ^/api/gateway/(.*)$ /$1 break;
        proxy_pass         http://$gateway_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout    10s;
        proxy_read_timeout    15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # nginx 的 add_header 不会跨层级合并：本 location 一旦出现 add_header，
        # server 级第 30-34 行那组安全头就全部失效。首页由此 location 提供，
        # 故必须在这里重复声明，否则 X-Frame-Options 等头不会下发。
        add_header X-Frame-Options        "SAMEORIGIN"       always;
        add_header X-Content-Type-Options "nosniff"          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        add_header X-XSS-Protection       "1; mode=block"    always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
