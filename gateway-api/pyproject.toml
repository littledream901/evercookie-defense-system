[project]
name = "fangyu-gateway-api"
version = "2.0.0"
description = "Evercookie Defense System - Decision Gateway"
requires-python = ">=3.11"
dependencies = [
    "fangyu-shared",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "gunicorn>=21.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "orjson>=3.9",
    "maxminddb>=2.5",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
    "ruff>=0.3",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "UP042", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
