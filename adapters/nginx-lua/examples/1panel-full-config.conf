# ═══════════════════════════════════════════════════════════════════════
# Fangyu Defense — 1Panel OpenResty 完整配置示例
# ═══════════════════════════════════════════════════════════════════════
# 适用版本: OpenResty 1.21+, 1Panel 2.x
# 更新日期: 2026-08-07
# ═══════════════════════════════════════════════════════════════════════

# ─── HTTP 全局配置 ─────────────────────────────────────────────────────
http {
    # Lua 代码缓存（生产环境必须开启）
    lua_code_cache on;

    # Lua 模块搜索路径
    lua_package_path "/opt/1panel/apps/openresty/openresty/conf/lua/?.lua;;";

    # 连接池优化
    lua_socket_pool_size 30;
    lua_socket_keepalive_timeout 60s;

    # 共享字典（用于缓存决策结果，可选）
    lua_shared_dict fangyu_cache 10m;

    # 日志格式（包含 Fangyu 决策信息）
    log_format main_with_fangyu '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time fy_mech=$fangyu_mechanism';

    # 限流区域（保护 Gateway 不被刷爆）
    limit_req_zone $binary_remote_addr zone=fangyu_limit:10m rate=20r/s;

    # ─── 上游配置（如果你的应用是反向代理） ─────────────────────────
    upstream backend_app {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # ─── 虚拟主机 ──────────────────────────────────────────────────────
    server {
        listen 80;
        server_name your-domain.com www.your-domain.com;

        # 强制 HTTPS（生产环境推荐）
        # return 301 https://$host$request_uri;

        # 或者直接 HTTP 服务（测试环境）
        access_log /opt/1panel/apps/openresty/openresty/www/sites/your-site/logs/access.log main_with_fangyu;
        error_log  /opt/1panel/apps/openresty/openresty/www/sites/your-site/logs/error.log warn;

        # ═══════════════════════════════════════════════════════════════
        # Fangyu 配置变量（必填）
        # ═══════════════════════════════════════════════════════════════
        set $fangyu_gateway_url  "https://defense.example.com";
        set $fangyu_site_id      "site_abc123xyz";      # 站点标识符（字符串）
        set $fangyu_app_id       "10001";               # 应用 ID（必须是纯数字，SDK 要求）
        set $fangyu_app_secret   "your_secret_key_here"; # HMAC 签名密钥
        set $fangyu_fail_mode    "open";                # open=网关故障时放行, closed=拦截
        set $fangyu_sdk_inject   "on";                  # on=自动注入 SDK, off=禁用
        set $fangyu_sdk_url      "";                    # 空=自动使用 gateway/sdk/fangyu-sdk.min.js
        set $fangyu_blocked_url  "/blocked";            # 拦截页路径
        set $fangyu_challenge_url "/challenge";         # 挑战页路径

        # 用于日志记录的变量（需在 Lua 中赋值）
        set $fangyu_mechanism    "-";

        # ═══════════════════════════════════════════════════════════════
        # 主应用路由
        # ═══════════════════════════════════════════════════════════════
        location / {
            # 限流保护（可选）
            limit_req zone=fangyu_limit burst=50 nodelay;

            # ──────────────────────────────────────────────────────────
            # 第一层防御：access 阶段调用 Fangyu
            # ──────────────────────────────────────────────────────────
            access_by_lua_file /opt/1panel/apps/openresty/openresty/conf/lua/fangyu/defense.lua;

            # ──────────────────────────────────────────────────────────
            # 你的原有配置（三选一）
            # ──────────────────────────────────────────────────────────

            # 方案 A: 静态文件服务
            root /opt/1panel/apps/openresty/openresty/www/sites/your-site;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # 方案 B: 反向代理到后端应用
            # proxy_pass http://backend_app;
            # proxy_http_version 1.1;
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;
            # proxy_set_header Connection "";

            # 方案 C: FastCGI（PHP 等）
            # fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            # fastcgi_index index.php;
            # include fastcgi_params;

            # ──────────────────────────────────────────────────────────
            # 第二层防御：body_filter 阶段注入 SDK
            # ──────────────────────────────────────────────────────────
            body_filter_by_lua_block {
                local snippet = ngx.ctx.fy_sdk_snippet
                if not snippet then return end

                -- 仅对 HTML 响应注入
                local ct = ngx.header["Content-Type"] or ""
                if not ct:find("text/html", 1, true) then return end

                -- 插入到 </head> 之前
                local chunk, eof = ngx.arg[1], ngx.arg[2]
                if chunk then
                    local modified = chunk:gsub("</head>", snippet .. "</head>", 1)
                    ngx.arg[1] = modified
                end
            }

            # ──────────────────────────────────────────────────────────
            # 日志阶段：记录决策结果（可选）
            # ──────────────────────────────────────────────────────────
            log_by_lua_block {
                -- 从 ngx.ctx 读取决策信息并写入变量供日志格式使用
                ngx.var.fangyu_mechanism = ngx.ctx.fangyu_mechanism or "-"
            }
        }

        # ═══════════════════════════════════════════════════════════════
        # 拦截页（静态 HTML）
        # ═══════════════════════════════════════════════════════════════
        location = /blocked {
            default_type "text/html; charset=utf-8";
            return 403 '<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问被拦截</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 80px; background: #f5f5f5; }
        h1 { color: #d32f2f; font-size: 3em; margin: 0; }
        p { color: #666; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>403</h1>
    <p>您的访问已被安全系统拦截</p>
    <p>如有疑问，请联系网站管理员</p>
</body>
</html>';
        }

        # ═══════════════════════════════════════════════════════════════
        # 挑战页（需要与 SDK 配合）
        # ═══════════════════════════════════════════════════════════════
        location = /challenge {
            default_type "text/html; charset=utf-8";
            return 200 '<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全验证</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 80px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; 
                   border-radius: 50%; width: 40px; height: 40px; 
                   animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>安全验证中...</h1>
    <div class="spinner"></div>
    <p>请稍候，系统正在验证您的访问请求</p>
</body>
</html>';
        }

        # ═══════════════════════════════════════════════════════════════
        # 健康检查端点（可选，用于监控）
        # ═══════════════════════════════════════════════════════════════
        location = /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ═══════════════════════════════════════════════════════════════
        # 静态资源（跳过防御检查，提升性能）
        # ═══════════════════════════════════════════════════════════════
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /opt/1panel/apps/openresty/openresty/www/sites/your-site;
            expires 7d;
            access_log off;
            # 静态资源不调用 Lua，直接放行
        }
    }

    # ─── HTTPS 虚拟主机（生产环境配置） ────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name your-domain.com www.your-domain.com;

        # SSL 证书（1Panel 自动管理）
        ssl_certificate     /opt/1panel/apps/openresty/openresty/conf/ssl/your-domain.com/fullchain.pem;
        ssl_certificate_key /opt/1panel/apps/openresty/openresty/conf/ssl/your-domain.com/privkey.pem;

        # SSL 优化配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        access_log /opt/1panel/apps/openresty/openresty/www/sites/your-site/logs/access.log main_with_fangyu;
        error_log  /opt/1panel/apps/openresty/openresty/www/sites/your-site/logs/error.log warn;

        # ═══════════════════════════════════════════════════════════════
        # Fangyu 配置变量（与 HTTP 块相同）
        # ═══════════════════════════════════════════════════════════════
        set $fangyu_gateway_url  "https://defense.example.com";
        set $fangyu_site_id      "site_abc123xyz";
        set $fangyu_app_id       "10001";
        set $fangyu_app_secret   "your_secret_key_here";
        set $fangyu_fail_mode    "open";
        set $fangyu_sdk_inject   "on";
        set $fangyu_sdk_url      "";
        set $fangyu_blocked_url  "/blocked";
        set $fangyu_challenge_url "/challenge";
        set $fangyu_mechanism    "-";

        # 其余配置与 HTTP 块相同
        location / {
            limit_req zone=fangyu_limit burst=50 nodelay;
            access_by_lua_file /opt/1panel/apps/openresty/openresty/conf/lua/fangyu/defense.lua;

            root /opt/1panel/apps/openresty/openresty/www/sites/your-site;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            body_filter_by_lua_block {
                local snippet = ngx.ctx.fy_sdk_snippet
                if not snippet then return end
                local ct = ngx.header["Content-Type"] or ""
                if not ct:find("text/html", 1, true) then return end
                local chunk = ngx.arg[1]
                if chunk then
                    ngx.arg[1] = chunk:gsub("</head>", snippet .. "</head>", 1)
                end
            }

            log_by_lua_block {
                ngx.var.fangyu_mechanism = ngx.ctx.fangyu_mechanism or "-"
            }
        }

        location = /blocked { return 403 '<html><body><h1>403 Forbidden</h1></body></html>'; }
        location = /challenge { return 200 '<html><body><h1>Security Check</h1></body></html>'; }
        location = /health { access_log off; return 200 "OK\n"; }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /opt/1panel/apps/openresty/openresty/www/sites/your-site;
            expires 7d;
            access_log off;
        }
    }
}

# ═══════════════════════════════════════════════════════════════════════
# 配置说明
# ═══════════════════════════════════════════════════════════════════════
#
# 1. 变量说明
#    - fangyu_gateway_url : Fangyu Gateway API 地址（必须 HTTPS）
#    - fangyu_site_id     : 站点标识符（字符串，作为 X-App-Key）
#    - fangyu_app_id      : 应用 ID（数字，SDK 配置需要）
#    - fangyu_app_secret  : 签名密钥（本地 HMAC-SHA256，不传输）
#    - fangyu_fail_mode   : 故障模式 (open=放行, closed=拦截)
#    - fangyu_sdk_inject  : 是否注入 SDK (on/off)
#
# 2. 双层防御机制
#    第一层: access_by_lua_file  → 服务端规则判定
#    第二层: body_filter + SDK   → 客户端行为分析
#
# 3. 性能优化
#    - lua_code_cache on         : 必须开启（生产环境）
#    - 静态资源跳过 Lua 处理
#    - 限流保护防止滥用
#
# 4. 安全建议
#    - 使用环境变量存储 app_secret（不要硬编码）
#    - 启用 HTTPS + HSTS
#    - 定期轮换密钥
#
# 5. 监控要点
#    - 错误日志: grep -i fangyu error.log
#    - 访问日志: 查看 fy_mech 字段（pass/deny/redirect）
#    - Gateway 延迟: 从日志提取 rt (request_time)
#
# ═══════════════════════════════════════════════════════════════════════
