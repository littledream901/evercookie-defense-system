version: "3.9"

services:
  # 版本与认证插件必须对齐生产（deploy/docker-compose.prod.yml 用 mysql:8.4）。
  # 此前用 8.0 + mysql_native_password 绕开了 caching_sha2_password，
  # 导致缺少 cryptography 依赖的问题在测试中不显现，直到生产迁移才暴露。
  # MySQL 8.4 已移除 mysql_native_password，不可再降级。
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fangyu_test
      MYSQL_USER: fangyu
      MYSQL_PASSWORD: fangyu
    ports:
      - "33306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    ports:
      - "36379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15

  clickhouse-test:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_DB: fangyu_test
      CLICKHOUSE_USER: fangyu
      CLICKHOUSE_PASSWORD: fangyu
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "38123:8123"
      - "39000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
