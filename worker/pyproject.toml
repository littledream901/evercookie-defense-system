[project]
name = "fangyu-worker"
version = "2.0.0"
description = "Evercookie Defense System - Stream Processing Worker"
requires-python = ">=3.11"
dependencies = [
    "fangyu-shared",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "orjson>=3.9",
    "aiochclient>=2.5",
    "aiohttp>=3.9",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "tenacity>=8.2",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
